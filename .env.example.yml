environment: dev
app:
  startup_timeout_ms: 30000 # 所有数据库和 Redis 初始化共用的总预算
  id: ult.service.001
  name: ult
  version: 1.0.0
datetime:
  location: Asia/Shanghai
  cst_layout: 2006-01-02 15:04:05
language:
  local: zh-cn
validator:
  locale: zh
  tagname: label
logger:
  max_size: 128
  max_backups: 5
  max_age: 7
  local_time: true
  compress: true
notify:
  recover:
    email:
      host: smtp.qq.com
      port: 465
      user: 123456@qq.com
      pass: 123456
      to: 666666@qq.com
db:
  default:
    connect_timeout_ms: 5000 # 单次初始化期限（毫秒），包含握手、探活和版本探测
    dsn: root:123456@tcp(0.0.0.0:3306)/apiserver?charset=utf8mb4&parseTime=True&loc=Local
    driver: mysql
    db_name: apiserver
    host: 0.0.0.0
    username: root
    password: 123456
    charset: utf8mb4
    port: 3306
    prefix: api_
    max_idle_conn: 10
    max_open_conn: 100
    max_life_time: 1800 # 秒；0 表示不限制连接寿命
    parse_time: true
    loc: Local
    max_retries: 3
    retry_delay: 2
redis:
  default:
    connect_timeout_ms: 5000 # 单次初始化期限（毫秒），包含连接、认证和探活
    network: tcp
    addr: 0.0.0.0
    port: 6379
    password: 123456
    db: 0
    min_idle_conns: 10
    max_conn_age: 100 # 秒；0 或 -1 表示不限制连接寿命
    idle_timeout: 0 # 秒；0 使用默认 30 分钟，-1 禁用空闲过期检查
    min_retry_backoff: 0 # 毫秒；0 使用默认 8ms，-1 禁用
    max_retry_backoff: 0 # 毫秒；0 使用默认 512ms，-1 禁用
    dial_timeout: 0 # 毫秒；0 使用底层默认值
    read_timeout: 0 # 毫秒；0 使用默认值，-1 仅禁用默认 socket 超时，仍遵守上下文 Deadline
    write_timeout: 0 # 毫秒；0 使用默认值，-1 仅禁用默认 socket 超时，仍遵守上下文 Deadline
    pool_timeout: 0 # 毫秒；0 使用底层默认值
    startup_max_attempts: 3 # 初始化最大尝试次数，包含首次尝试
    startup_retry_delay: 2 # 初始化重试间隔（秒）
    max_retries: 0 # 命令重试默认禁用；正数仅用于可安全重放命令的连接，-1 也表示禁用
jwt:
  app: ult.service
  issuer: '1203822711'
  algorithm: HS256 # 留空默认 HS256；支持 HS256/384/512、RS256/384/512、PS256/384/512、ES256/384/512、EdDSA
  secret: kP3vN8mQ2xR7wT5yU9zA4bC6dE0fG1hJ
  private_key_file: '' # 非对称算法时清空 secret，填写签名私钥 PEM 路径（PKCS#8、RSA PKCS#1 或 EC SEC1）
  public_key_file: '' # 仅验签时填写公钥 PEM 路径（PKIX 或 RSA PKCS#1），与私钥二选一
  audience: [] # 可选接收方约束；密钥相对路径以本配置文件目录为基准
server:
  http:
    network: tcp
    host: 127.0.0.1
    port: 10001
    max_body_bytes: 2097152 # 字节；0 使用默认 2 MiB
    read_header_timeout_ms: 5000 # 毫秒；0 使用默认值
    read_timeout_ms: 15000 # 整个请求的读取期限（毫秒），包含请求头和正文
    write_timeout_ms: 30000 # 响应写入期限（毫秒）
    idle_timeout_ms: 60000 # 长连接空闲期限（毫秒）
    cors:
      enabled: false
      allowed_origins: [] # 启用时填写完整 Origin，例如 https://app.example.com
      allowed_methods: [GET, POST, PUT, PATCH, DELETE, HEAD]
      allowed_headers: [Content-Type, Authorization, x-md-trace-id]
      allow_credentials: false # 为 true 时禁止使用通配来源 *
